# Spike: drive `codex app-server` over JSON-RPC (feeds slice O4, the Codex
# subscription provider). Workspace-excluded; own lockfile.
[package]
name = "codex-driver-spike"
description = "Protocol probe for Odori's subscription-backed Codex provider"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/tokeira/tokeira-odori"
publish = false

[workspace]
resolver = "3"

[dependencies]
anyhow = "1"
serde_json = "1"
tokio = { version = "1", features = [
    "io-util",
    "macros",
    "process",
    "rt-multi-thread",
    "time",
] }
