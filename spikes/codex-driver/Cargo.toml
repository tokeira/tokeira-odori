# Spike: drive `codex app-server` over JSON-RPC (feeds slice O4, the Codex
# subscription provider). Workspace-excluded; own lockfile.
[package]
name = "codex-driver-spike"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]
resolver = "3"

[dependencies]
anyhow = "1"
serde_json = "1"
tokio = { version = "1", features = [
    "io-util",
    "macros",
    "process",
    "rt-multi-thread",
    "time",
] }
