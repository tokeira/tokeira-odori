# Spike: driving headless Claude Code from Rust (feeds slice O3, the Claude
# provider). Workspace-excluded; own lockfile.
[package]
name = "claude-driver-spike"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]
resolver = "3"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
    "macros",
    "rt-multi-thread",
    "process",
    "io-util",
    "time",
] }
