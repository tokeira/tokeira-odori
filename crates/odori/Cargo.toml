[package]
name = "odori"
description = "Minimal Rust agent framework with durable execution via embedded tokeira"
readme = "README.md"
keywords = ["ai-agents", "durable-execution", "agent-framework", "workflow", "rust"]
categories = ["asynchronous", "development-tools"]
documentation = "https://docs.rs/odori"
publish = true
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
odori-agents = { workspace = true }
odori-providers = { workspace = true }
odori-engine = { workspace = true }
odori-mcp-bridge = { workspace = true }

[dev-dependencies]
async-trait = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }

[features]
# Forwarding switch for the mcp-bridge (spec Requirement 8): enables the
# bridge crate and the engine wiring together.
preview = ["odori-engine/preview", "odori-mcp-bridge/preview"]
# The API-backed secondary provider tier, off by default (subscription-first).
api-anthropic = ["odori-providers/api-anthropic"]
api-openai = ["odori-providers/api-openai"]

[lints]
workspace = true
