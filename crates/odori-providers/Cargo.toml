[package]
name = "odori-providers"
description = "Odori model providers: supervised vendor harnesses (Claude Code, Codex) first, raw APIs behind features"
readme = "README.md"
keywords = ["ai-agents", "codex", "claude-code", "agent-framework", "llm"]
categories = ["api-bindings", "development-tools"]
documentation = "https://docs.rs/odori-providers"
publish = true
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
async-trait = { workspace = true }
futures = { workspace = true }
odori-agents = { workspace = true }
reqwest = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true, optional = true }

[dev-dependencies]
odori-mcp-bridge = { workspace = true, features = ["preview"] }
proptest = { workspace = true }

# The scripted Claude Code test double (see src/bin/fake_claude.rs): built
# unconditionally so the provider's unguarded CI tests can spawn it via
# CARGO_BIN_EXE, and usable as the demo's recorded fallback.
[[bin]]
name = "odori-fake-claude"
path = "src/bin/fake_claude.rs"

[features]
# Raw-API providers are the secondary tier: minimal internal loops over the
# vendors' HTTP APIs, off by default. Subscription harnesses are the default
# tier and are always compiled.
api-anthropic = ["dep:reqwest", "dep:uuid"]
api-openai = ["dep:reqwest"]

[lints]
workspace = true
