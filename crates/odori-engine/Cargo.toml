[package]
name = "odori-engine"
description = "Odori's durable-execution substrate: embedded tokeira wired to the Temporal Rust SDK worker"
readme = "README.md"
keywords = ["durable-execution", "workflow", "temporal", "ai-agents", "embedded"]
categories = ["asynchronous", "development-tools"]
documentation = "https://docs.rs/odori-engine"
publish = true
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
anyhow = { workspace = true }
odori-agents = { workspace = true }
odori-mcp-bridge = { workspace = true, optional = true }
temporalio-client = { workspace = true }
temporalio-common = { workspace = true }
temporalio-macros = { workspace = true }
temporalio-sdk = { workspace = true }
temporalio-sdk-core = { workspace = true }
tokio = { workspace = true }
tokeira-config = { workspace = true }
tokeira-engine = { workspace = true }
tracing = { workspace = true }

[features]
# The mcp-bridge descope boundary (spec Requirement 8): off = no listener,
# no attachment injection, no bridge code on any path.
preview = ["dep:odori-mcp-bridge", "odori-mcp-bridge/preview"]

[lints]
workspace = true
