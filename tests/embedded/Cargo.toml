# Integration harness: the Odori primitives against the real embedded
# tokeira engine over service_override. A workspace member outside
# `default-members`, so `--workspace` builds and tests it while a bare build
# compiles only what ships. The engine resolves from the registry like every
# other dependency, on the workspace's one lockfile.
[package]
name = "odori-embedded-harness"
description = "Integration harness for Odori's embedded engine and examples"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/tokeira/tokeira-odori"
publish = false

[dependencies]
anyhow = { workspace = true }
odori-agents = { workspace = true }
odori-engine = { workspace = true }

[dev-dependencies]
async-trait = { workspace = true }
odori-dev-support = { workspace = true }
odori-engine = { workspace = true, features = ["preview"] }
odori-examples = { workspace = true }
odori-mcp-bridge = { workspace = true, features = ["preview"] }
odori-providers = { workspace = true, features = [
    "api-anthropic",
    "api-openai",
] }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokeira-managed-dsql = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[lints]
workspace = true
