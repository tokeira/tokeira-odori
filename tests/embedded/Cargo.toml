# Integration harness: the Odori primitives against the real embedded
# tokeira engine over service_override. Workspace-excluded (own lockfile)
# because it depends on the engine repo, whose graph must not expand or
# constrain the product workspace; the engine arrives as a git dependency so
# the harness builds identically from any checkout or worktree.
[package]
name = "odori-embedded-harness"
description = "Workspace-excluded integration harness for Odori's embedded engine examples"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/tokeira/tokeira-odori"
publish = false

[dependencies]
anyhow = { workspace = true }
odori-agents = { workspace = true }
odori-engine = { workspace = true }

[dev-dependencies]
async-trait = { workspace = true }
odori-dev-support = { workspace = true }
odori-engine = { workspace = true, features = ["preview"] }
odori-examples = { workspace = true }
odori-mcp-bridge = { workspace = true, features = ["preview"] }
odori-providers = { workspace = true, features = [
    "api-anthropic",
    "api-openai",
] }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokeira-managed-dsql = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[lints]
workspace = true
