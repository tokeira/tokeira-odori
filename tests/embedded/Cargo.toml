# Integration harness: the Odori primitives against the real embedded
# tokeira engine over service_override. Workspace-excluded (own lockfile)
# because it depends on the engine repo, whose graph must not expand or
# constrain the product workspace; the engine arrives as a git dependency so
# the harness builds identically from any checkout or worktree.
[package]
name = "odori-embedded-harness"
description = "Workspace-excluded integration harness for Odori's embedded engine examples"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/tokeira/tokeira-odori"
publish = false

[workspace]
resolver = "3"

[[example]]
name = "hello-durable"
path = "../../examples/hello-durable/main.rs"

[[example]]
name = "slice-fleet"
path = "../../examples/slice-fleet/main.rs"

[[example]]
name = "rewind"
path = "../../examples/rewind/main.rs"

[[example]]
name = "approval-resume"
path = "../../examples/approval-resume/main.rs"

[dependencies]
odori = { path = "../../crates/odori" }
odori-agents = { path = "../../crates/odori-agents" }
odori-engine = { path = "../../crates/odori-engine", features = ["preview"] }
odori-mcp-bridge = { path = "../../crates/odori-mcp-bridge", features = ["preview"] }
odori-providers = { path = "../../crates/odori-providers", features = [
    "api-anthropic",
    "api-openai",
] }

[dev-dependencies]
anyhow = "1"
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
temporalio-client = "0.7"
tokeira-engine = { git = "ssh://git@github.com/tokeira/tokeira.git", rev = "b9fc3f789a34f3c524b97223417044b1eecca71a" }
tokeira-managed-dsql = { git = "ssh://git@github.com/tokeira/tokeira.git", rev = "b9fc3f789a34f3c524b97223417044b1eecca71a" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
