# Integration harness: the Odori primitives against the real embedded
# tokeira engine over service_override. Workspace-excluded (own lockfile)
# because it depends on the engine repo, whose graph must not expand or
# constrain the product workspace; the engine arrives as a git dependency so
# the harness builds identically from any checkout or worktree.
[package]
name = "odori-embedded-harness"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]
resolver = "3"

[dependencies]
odori = { path = "../../crates/odori" }
odori-agents = { path = "../../crates/odori-agents" }
odori-engine = { path = "../../crates/odori-engine" }

[dev-dependencies]
anyhow = "1"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
temporalio-client = "0.7"
tokeira-engine = { git = "ssh://git@github.com/tokeira/tokeira.git" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
