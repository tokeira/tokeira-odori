# cargo-deny — Odori supply-chain and license posture.
#
# Run locally with `cargo deny check`. Mirrors the engine repo's posture:
# fail on known vulnerabilities, untrusted sources, and any license outside an
# explicit allowlist. Schema reference:
# https://embarkstudios.github.io/cargo-deny/

[advisories]
# RustSec advisory DB (default source). An active vulnerability fails the
# check. Entries below are transitive advisories with no upstream fix
# available, each a non-vulnerability (unmaintained crate) pulled in deep in
# the tree. Revisit when the upstream dependency updates.
ignore = [
    "RUSTSEC-2025-0012", # `backoff` unmaintained (transitive, via temporalio)
]

[licenses]
# Deny-by-default: every crate in the tree must resolve to one of these SPDX ids.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "0BSD",
]
confidence-threshold = 0.9
# Per-crate license exceptions, each justified, go here as the tree requires them.
exceptions = [
    # webpki-roots bundles Mozilla's CA certificate set under the data-only
    # CDLA-Permissive-2.0 license; the crate's own code is permissive.
    { crate = "webpki-roots", allow = ["CDLA-Permissive-2.0"] },
]

[bans]
# Large async trees legitimately carry duplicate versions — warn, don't fail.
multiple-versions = "warn"
# Wildcard ("*") version requirements are forbidden; we pin every external dep.
wildcards = "deny"
# ...except internal `path` deps, which legitimately have no version requirement.
allow-wildcard-paths = true

[sources]
# Crates.io plus the reviewed Tokeira engine and Temporal SDK fix repositories.
# Both git sources remain commit-pinned in Cargo.toml; other sources are denied.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    "ssh://git@github.com/tokeira/tokeira.git",
    "https://github.com/tokeira/sdk-rust.git",
]
