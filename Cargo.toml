[workspace]
resolver = "3"
members = [
    "crates/odori",
    "crates/odori-agents",
    "crates/odori-providers",
    "crates/odori-engine",
    "crates/odori-mcp-bridge",
]
exclude = [
    # The embedded integration harness depends on the engine repo; excluded so
    # that graph never expands or constrains the product workspace. Run with
    # `cargo test --manifest-path tests/embedded/Cargo.toml`.
    "tests/embedded",
    # Phase-1 protocol probe for the subscription-backed Codex provider. It
    # carries its own lockfile so experimental dependencies and wire probes do
    # not move the product workspace graph.
    "spikes/codex-driver",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
authors = ["Ian Wilkinson <ianw1@mac.com>"]
repository = "https://github.com/tokeira/tokeira-odori"
homepage = "https://tokeira.io"

[workspace.dependencies]
# The Temporal Rust SDK is the worker SDK; the embedded tokeira engine speaks
# the same Temporal contract in-process via
# `ConnectionOptions::service_override` (an in-memory duplex — no TCP
# listener, no port). Vanilla crates.io pins — no fork, no [patch] — by
# launch decision (the replay-guard fix, upstream PR #1353, ships in this
# line).
temporalio-sdk = "0.7"
temporalio-sdk-core = "0.7"
temporalio-client = "0.7"
temporalio-common = "0.7"
temporalio-macros = "0.7"
# The macros' expansions reference this crate by name, so any crate using
# `#[workflow_methods]` needs it as a direct dependency.
temporalio-workflow = "0.7"
# Odori's embedded-engine wrapper forwards the engine's public configuration,
# startup report, and typed failures at the E1 revision.
tokeira-config = { git = "ssh://git@github.com/tokeira/tokeira.git", rev = "3553009a31df48a942932df404ff5e92fff32dac", version = "0.1.0" }
tokeira-engine = { git = "ssh://git@github.com/tokeira/tokeira.git", rev = "3553009a31df48a942932df404ff5e92fff32dac", version = "0.1.0" }

anyhow = "1.0"
async-trait = "0.1"
bytes = "1"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["server", "tokio"] }
# Property-based testing (dev-dependency tier): the mcp-bridge spec's
# correctness properties P1-P7 are required PBT suites (engine repo pins the
# same line).
proptest = "1"
# API-tier HTTP client (behind the api-* provider features only). Default
# features OFF is load-bearing, mirroring the engine repo: rustls everywhere,
# no native-tls / OpenSSL dynamic linking.
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
    "charset",
    "http2",
    "stream",
] }
futures = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.41", features = ["full"] }
tokio-stream = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
uuid = { version = "1.10", features = ["serde", "v4"] }

# Internal crates carry an explicit version so intra-workspace requirements
# stay publishable (and cargo-deny's wildcard ban stays meaningful).
odori = { path = "crates/odori", version = "0.1.0" }
odori-agents = { path = "crates/odori-agents", version = "0.1.0" }
odori-providers = { path = "crates/odori-providers", version = "0.1.0" }
odori-engine = { path = "crates/odori-engine", version = "0.1.0" }
odori-mcp-bridge = { path = "crates/odori-mcp-bridge", version = "0.1.0" }

# Mechanized AGENTS.md rules: prose rules drift under a fluid codebase;
# compiler-enforced ones survive refactors. Everything here is binding and
# mirrors the engine repo's posture — a fresh repo starts at the bar the
# engine burned down to.
[workspace.lints.rust]
unsafe_code = "deny"
unreachable_pub = "warn"
missing_debug_implementations = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
undocumented_unsafe_blocks = "deny" # every retained unsafe block carries // SAFETY:
unwrap_used = "deny"                # expect-with-invariant-message is the sanctioned remedy
print_stdout = "deny"               # tracing, not println — CLI surfaces carry documented allows
print_stderr = "deny"
